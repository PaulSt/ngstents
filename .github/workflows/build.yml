name: Build and test packages

on:
  workflow_dispatch:
    inputs:
      ngsolve_version:
        description: NGSolve version (empty builds the current checkout)
        type: string
      dry_run:
        description: Build and test without uploading to PyPI
        type: boolean
        default: true
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
    env:
      CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_ENVIRONMENT_WINDOWS: >
        CMAKE_GENERATOR='Visual Studio 17 2022'
        CMAKE_GENERATOR_PLATFORM=x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-tags: 'true'
          fetch-depth: 0

      - uses: PaulSt/test-watcher@main
        with:
          ngsolve_version: ${{ inputs.ngsolve_version }}
          dry_run: ${{ inputs.dry_run }}

      - uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  test_wheels:
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse
      - run: python -m pip install wheelhouse/*cp313-cp313*.whl
        shell: bash
      - run: python -m pip install pytest
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python -m pytest .
        working-directory: tests

  build_sdist:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-tags: 'true'
          fetch-depth: 0

      - uses: PaulSt/test-watcher@main
        id: release
        with:
          ngsolve_version: ${{ inputs.ngsolve_version }}
          dry_run: ${{ inputs.dry_run }}

      - run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish-pypi:
    if: >-
      !inputs.dry_run && needs.build_sdist.outputs.published != 'true' &&
      (startsWith(github.ref, 'refs/tags/') || inputs.ngsolve_version != '')
    needs: [test_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
